# Runs the live TfL collector in the cloud every 15 minutes and commits the
# new snapshot to data/tfl_live_status.csv ("git scraping").
# This replaces the Windows Task Scheduler job, which only ran while the
# laptop was awake.

name: Collect TfL status

on:
  schedule:
    # every 15 min (UTC), at off-peak minutes: GitHub is busiest on the hour and
    # quarter-hour, when scheduled runs are most often delayed or dropped
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # needed to commit the new data

# Never run two collections at once (they would both try to push)
concurrency:
  group: collect-tfl-status
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect live status
        run: python collect_tfl_status.py

      - name: Commit and push new data
        run: |
          git config user.name  "tfl-collector-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tfl_live_status.csv
          if git diff --cached --quiet; then
            echo "No new data"; exit 0
          fi
          git commit -m "Live TfL snapshot $(date -u +'%Y-%m-%d %H:%M') UTC"
          # retry in case someone else pushed in the meantime
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
